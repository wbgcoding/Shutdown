name: CI

# Builds the app and runs the test suite on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # The app and the tests target .NET Framework 4.8 with WPF, so the runner has to be Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/Shutdown/Shutdown.csproj -c Release

      - name: Test
        run: dotnet test tests/Shutdown.Tests -c Release
